# ============================================================================
# Inventaire Ansible pour PowerSC MFA sur IBM i
# ============================================================================
# Ce fichier définit les serveurs IBM i cibles pour la configuration MFA
# ============================================================================

# ----------------------------------------------------------------------------
# Serveurs IBM i de production
# ----------------------------------------------------------------------------
[ibmi_prod_servers]
# Serveur principal
ibmi_prod ansible_host=192.168.1.100 ansible_user=ANSIBLE

# Serveur secondaire (si applicable)
# ibmi_prod2 ansible_host=192.168.1.101 ansible_user=ANSIBLE

# ----------------------------------------------------------------------------
# Serveurs IBM i de développement/test
# ----------------------------------------------------------------------------
[ibmi_dev_servers]
# Serveur de développement
ibmi_dev ansible_host=192.168.1.200 ansible_user=ANSIBLE

# Serveur de test
# ibmi_test ansible_host=192.168.1.201 ansible_user=ANSIBLE

# ----------------------------------------------------------------------------
# Serveurs IBM i de staging/pré-production
# ----------------------------------------------------------------------------
[ibmi_staging_servers]
# Serveur de staging
# ibmi_staging ansible_host=192.168.1.150 ansible_user=ANSIBLE

# ----------------------------------------------------------------------------
# Tous les serveurs IBM i
# ----------------------------------------------------------------------------
[ibmi_servers:children]
ibmi_prod_servers
ibmi_dev_servers
ibmi_staging_servers

# ----------------------------------------------------------------------------
# Variables communes à tous les serveurs IBM i
# ----------------------------------------------------------------------------
[ibmi_servers:vars]
# Interpréteur Python sur IBM i
ansible_python_interpreter=/QOpenSys/pkgs/bin/python3

# Clé SSH privée pour l'authentification
ansible_ssh_private_key_file=~/.ssh/ibmi_ansible

# Options SSH communes
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Timeout de connexion (secondes)
ansible_connection_timeout=30

# Devenir un autre utilisateur (si nécessaire)
# ansible_become=yes
# ansible_become_method=su
# ansible_become_user=QSECOFR

# ----------------------------------------------------------------------------
# Variables spécifiques à la production
# ----------------------------------------------------------------------------
[ibmi_prod_servers:vars]
# Environnement
environment_type=production

# Niveau de sécurité plus élevé
security_level=high

# Sauvegardes activées
backup_enabled=true

# Notifications activées
notifications_enabled=true

# ----------------------------------------------------------------------------
# Variables spécifiques au développement
# ----------------------------------------------------------------------------
[ibmi_dev_servers:vars]
# Environnement
environment_type=development

# Niveau de sécurité standard
security_level=medium

# Sauvegardes désactivées
backup_enabled=false

# Notifications désactivées
notifications_enabled=false

# Mode debug activé
debug_mode=true

# ----------------------------------------------------------------------------
# Variables spécifiques au staging
# ----------------------------------------------------------------------------
[ibmi_staging_servers:vars]
# Environnement
environment_type=staging

# Niveau de sécurité élevé
security_level=high

# Sauvegardes activées
backup_enabled=true

# Notifications limitées
notifications_enabled=true

# ============================================================================
# NOTES D'UTILISATION
# ============================================================================
#
# 1. Configuration de base :
#    - Remplacer les adresses IP par vos serveurs réels
#    - Configurer l'utilisateur Ansible approprié
#    - Vérifier le chemin de l'interpréteur Python
#
# 2. Authentification SSH :
#    - Générer une paire de clés SSH : ssh-keygen -t rsa -b 4096
#    - Copier la clé publique : ssh-copy-id ANSIBLE@ibmi_host
#    - Tester la connexion : ssh -i ~/.ssh/ibmi_ansible ANSIBLE@ibmi_host
#
# 3. Test de connectivité :
#    ansible -i inventory.ini ibmi_servers -m ping
#
# 4. Exécution des playbooks :
#    ansible-playbook -i inventory.ini main_configure_mfa.yml
#
# 5. Cibler un environnement spécifique :
#    ansible-playbook -i inventory.ini playbook.yml --limit ibmi_prod_servers
#
# 6. Mode check (dry-run) :
#    ansible-playbook -i inventory.ini playbook.yml --check
#
# 7. Mode verbeux :
#    ansible-playbook -i inventory.ini playbook.yml -vvv
#
# ============================================================================

